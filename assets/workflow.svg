<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img" aria-label="Workflow: a batch is parsed, checked by unsiloed-ops, reviewed by a human, then delivered"><title>Workflow: a batch is parsed, checked by unsiloed-ops, reviewed by a human, then delivered</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker></defs><rect x="0" y="0" width="1000" height="390" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" /><rect x="30" y="110" width="150" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" /><circle cx="52" cy="132" r="11" fill="#0284c7"/><text x="52" y="137" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" >1</text><text x="105" y="166" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#075985" text-anchor="middle" >Customer batch</text><text x="105" y="186" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#075985" text-anchor="middle" >documents uploaded</text><line x1="182" y1="155" x2="225" y2="155" stroke="#6366f1" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="228" y="110" width="150" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" /><circle cx="250" cy="132" r="11" fill="#0284c7"/><text x="250" y="137" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" >2</text><text x="303" y="166" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#075985" text-anchor="middle" >Parser runs</text><text x="303" y="186" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-